name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Rust and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Native regression
        run: cargo test --workspace --release --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked -p am-cli
      - name: MCP smoke and public 2.x migration
        run: python scripts/smoke_mcp.py --migration
      - name: Compatibility launcher syntax
        run: node --check bin/ant-memory.mjs
      - name: Lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
